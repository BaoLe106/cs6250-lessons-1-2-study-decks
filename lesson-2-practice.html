<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 2 Practice · 60 Questions</title><link rel="stylesheet" href="study-deck.css"><link rel="stylesheet" href="mcq.css"></head><body><div class="app"><div class="progress"><i></i></div><main></main></div><script>
const topics=[
['transport layer','it provides application-to-application service above IP','it only transmits bits','it replaces every router','it assigns MAC vendors','It accepts application messages, makes segments, and offers services that hide IP best-effort behavior.'],
['multiplexing','it gathers data from multiple sockets into labeled segments','it gives every host a new IP','it removes ports','it is router forwarding','Many processes share one host/network interface, so transport labels their traffic before sending.'],
['demultiplexing','it delivers an arriving segment to the matching socket','it adds a physical signal','it chooses a DNS root','it blocks all other apps','The receiving host examines transport fields to select the correct local application endpoint.'],
['UDP socket ID','it uses destination IP and destination port','it uses all four endpoint fields','it uses only a MAC address','it uses a root bridge ID','Connectionless UDP directs all matching destination-port traffic to one local socket despite differing sources.'],
['TCP socket ID','it uses source/destination IPs and ports','it uses only destination port','it uses only the server IP','it uses a MAC forwarding table','The four-tuple distinguishes simultaneous connections to the same server port from different clients.'],
['UDP','it is connectionless with minimal transport mechanisms','it guarantees ordered reliable bytes','it requires a three-way handshake','it runs only on routers','UDP sends immediately after the application supplies data; the application chooses whether/how to handle loss or rate.'],
['UDP checksum','it detects corruption but does not guarantee recovery','it supplies a TCP handshake','it identifies an IP route','it blocks congestion','The checksum is a basic integrity check; UDP lacks built-in retransmission and ordering mechanisms.'],
['TCP handshake','SYN, SYN+ACK, ACK establish connection state','FIN, FIN, FIN establish data','DNS, HTTP, IP establish state','three ACKs establish state','The exchange synchronizes initial sequence numbers and lets both endpoints allocate connection state.'],
['TCP teardown','FIN/ACK exchanges close each side of a connection','SYN is repeated forever','a router deletes the connection','a switch clears every MAC','Each direction closes separately; the final ACK may need to be repeated if it is lost.'],
['sequence numbers','they identify byte positions for reliable ordered delivery','they identify Ethernet vendors','they replace IP addresses','they select a root bridge','TCP needs positions to detect what is missing, duplicated, or out of order in the byte stream.'],
['ACKs','they report receipt and drive retransmission/rate decisions','they reserve a circuit','they create a MAC address','they stop DNS','ACK feedback tells a TCP sender which data has safely arrived and also clocks window growth.'],
['timeout','it retransmits when an expected ACK does not arrive','it guarantees congestion never occurs','it creates a UDP session','it maps a port to a MAC','A timeout is loss evidence but must balance quick recovery against spurious retransmissions from variable RTT.'],
['fast retransmit','three duplicate ACKs trigger early retransmission','three SYNs close a connection','three ports create a socket','three routers form a tree','Repeated ACKs for the same next expected sequence imply later data arrived while one segment is likely missing.'],
['sliding window','it permits multiple unacknowledged packets in flight','it only sends one then waits','it removes buffering','it is a NAT table','Pipelining raises utilization, but sequence tracking and sender/receiver buffers are needed.'],
['flow control','it protects the receiver buffer using rwnd','it protects routers using cwnd','it replaces reliability','it assigns DNS names','The receiver advertises free buffer space; sender limits outstanding data so the receiver is not overrun.'],
['zero window probe','it discovers when a previously full receiver has room','it permanently ends TCP','it detects a bridge loop','it chooses a new IP','Small probes prevent a deadlock where the sender learned rwnd=0 but never hears that the app drained the buffer.'],
['congestion control','it protects a shared network path from overload','it only protects an app buffer','it guarantees no packet loss','it is identical to NAT','Combined flow rates above a bottleneck capacity build queues, delay, and drops, so senders must adapt.'],
['cwnd','it caps network-driven in-flight data','it is the receiver buffer size','it is a UDP port','it is a MAC table','TCP uses cwnd to probe for capacity and reduces it when congestion is inferred.'],
['AIMD','it gently increases cwnd and multiplicatively decreases after loss','it always doubles cwnd','it sends one packet forever','it routes IP by MAC','Additive growth probes capacity while sharp reduction reacts to congestion, producing TCP’s sawtooth.'],
['slow start','it grows cwnd roughly exponentially from a cold start','it halves cwnd every ACK','it disables TCP reliability','it is a switch loop fix','Starting small avoids an initial burst, while doubling per RTT finds a usable rate faster than linear AIMD.'],
['TCP fairness','ideal AIMD tends toward equal bottleneck shares','all flows always receive exactly equal bandwidth','only UDP is fair','RTT never matters','Under equal RTT and simple assumptions, shared increase/decrease moves flows toward equal share; real exceptions exist.'],
['RTT unfairness','shorter RTT flows can grow ACK-clocked windows faster','longer RTT always wins','RTT only affects DNS','RTT is a MAC field','Reno adjusts based on arriving ACKs, so a short RTT provides more adjustment opportunities per unit time.'],
['parallel TCP flows','an app can gain more share by opening many connections','they force STP root election','they remove ports','they make cwnd infinite','Fairness is generally per flow, so one app using many flows can capture more than an app using one.'],
['TCP CUBIC','it uses time-based cubic window growth near Wmax','it uses only UDP checksums','it abandons congestion control','it doubles forever','CUBIC grows aggressively far below the previous loss window and cautiously near it, improving high-BDP utilization.'],
['Wmax in CUBIC','it is the window at the last loss event','it is the receiver buffer','it is a port number','it is a DNS cache size','The previous loss point is a useful caution region: CUBIC slows its growth near Wmax to avoid repeated congestion.'],
['TCP throughput model','more RTT or loss lowers Reno-style throughput','loss always raises throughput','RTT changes only MAC addresses','throughput ignores cwnd','A simplified Reno model scales inversely with RTT and roughly with one over square root of loss probability.'],
['DCTCP','it combines loss behavior with ECN feedback in datacenters','it is a Layer-2 loop protocol','it is DNS encryption','it removes all congestion signals','Datacenter operators can coordinate endpoints and switches, allowing explicit congestion signaling to be deployed together.'],
['TIMELY','it adapts using the RTT gradient','it uses bridge IDs','it chooses IP routes by MAC','it creates a TCP handshake','Delay trends can signal growing queues; TIMELY uses that feedback for datacenter congestion control.'],
['network-assisted control','routers can explicitly signal congestion','hosts must never infer congestion','it removes endpoints','it is identical to flow control','Explicit feedback such as ECN can supplement endpoint inference, though classic TCP was designed to work without router support.'],
['effective TCP send limit','it is min(cwnd,rwnd)','it is max(cwnd,rwnd)','it is always the link capacity','it is a fixed port','The sender must obey both constraints: receiver space and a safe path estimate; the smaller one controls in-flight data.']
];
const forms=[t=>`Which statement best defines ${t[0]}?`,t=>`Which outcome is most directly associated with ${t[0]}?`];
window.MCQ_DATA=topics.flatMap((t,n)=>forms.map((f,i)=>{const a=[t[1],t[2],t[3],t[4]],r=(n+i)%4,o=[...a.slice(r),...a.slice(0,r)];return[f(t),...o,(4-r)%4,t[5]]}));
