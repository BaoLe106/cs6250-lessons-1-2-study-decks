<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 1 Practice · 60 Questions</title><link rel="stylesheet" href="study-deck.css"><link rel="stylesheet" href="mcq.css"></head><body><div class="app"><div class="progress"><i></i></div><main></main></div><script>
const topics=[
['packet switching','it divides data into shareable packets','it reserves one circuit','it replaces IP addresses','it only works on Wi-Fi','It lets bursty computer traffic share links efficiently; this is a historical foundation of the Internet.'],
['open architecture','independent networks interconnect through common protocols','all networks use the same hardware','routers run applications','every link is identical','It enables a network of networks: each network can evolve internally while common internetworking rules join them.'],
['DNS','it maps names to IP addresses in a distributed system','it retransmits TCP segments','it forwards Ethernet frames','it encrypts all traffic','DNS solves scalable naming; it avoids maintaining one global host-name table.'],
['layering','each layer uses below and serves above','each layer knows every implementation','only routers have layers','applications choose cables','Stable service boundaries localize complexity and permit interoperability and change.'],
['application layer','it defines application-facing protocols such as HTTP and DNS','it sends electrical signals','it chooses router links','it learns MAC ports','It expresses application messages and protocol semantics, not local signaling or routing.'],
['transport layer','it provides process-to-process service using TCP or UDP','it forwards only physical signals','it maps domain names','it selects switch ports','Transport sits above IP and can add end-to-end behavior that applications use.'],
['network layer','it uses IP to address and forward across networks','it uses only MAC addresses on one link','it renders web pages','it repeats bits','IP provides best-effort across-network delivery; it does not itself identify the receiving process.'],
['link layer','it delivers frames locally using technologies such as Ethernet/Wi-Fi','it makes DNS names','it guarantees global routing','it is the same as TCP','A link frame is local to one hop; routers replace it when forwarding onward.'],
['encapsulation','message becomes segment, IP datagram, then frame','frame becomes message before sending','IP removes every header at sender','MAC replaces TCP','Each lower layer wraps data with the control information its peer will need.'],
['end-to-end principle','application-specific functions belong at endpoints when they need endpoint knowledge','routers must ensure every app behaves identically','the core must store session state','all traffic must use TCP','Different applications value different trade-offs, so a simple general core lets endpoints choose.'],
['NAT','it rewrites private/public address and port mappings','it creates a new DNS root','it is a Layer-1 repeater','it eliminates routing','NAT conserves public IPv4 addresses but weakens the original direct end-to-end reachability model.'],
['hourglass waist','IP is the narrow common substrate','HTTP is the only application','Ethernet is the only link','NAT is the waist','Many applications and link technologies can evolve around a small shared IP-centered middle.'],
['ossification','dependence makes a dominant core hard to replace','a protocol is physically damaged','TCP checksum fails','a switch loop forms','Adoption creates a coordination problem: replacements need applications, operators, and systems to move together.'],
['hub','it repeats bits/signals at Layer 1','it forwards using IP','it learns MAC addresses','it runs TCP','A hub has no destination awareness; its simple repetition yields a shared collision domain.'],
['switch','it forwards frames using MAC addresses at Layer 2','it routes between IP networks only','it repeats all bits','it translates DNS','A learning bridge/switch selectively forwards local frames once it knows a MAC-to-port mapping.'],
['router','it forwards IP packets between networks at Layer 3','it repeats signals only','it uses TCP ports to select LAN ports','it creates DNS records','A router interconnects networks and re-encapsulates the IP packet for each outgoing link.'],
['learning bridge','it learns source MAC to incoming port','it learns destination MAC to incoming port','it learns IP to TCP port','it learns root ID from HTTP','Arrival is evidence of the source location. Destination lookup then chooses selective forwarding or flooding.'],
['unknown unicast','it floods all ports except the incoming port','it drops every frame','it sends only to the root','it rewrites the source IP','Flooding reaches an unknown destination; a reply lets the bridge learn the missing destination mapping.'],
['Layer-2 loop','frames can circulate because they have no hop limit','IP TTL stops every Ethernet frame','only DNS is affected','it improves MAC learning','Repeated copies cause storms and can make a source MAC appear to move between ports.'],
['spanning tree','it keeps connectivity while blocking loop-forming forwarding ports','it removes every physical cable','it assigns IP addresses','it encrypts bridge messages','STP selects a connected acyclic active topology and retains physical redundancy for future failures.']
];
const forms=[t=>`Which statement best defines ${t[0]}?`,t=>`Which outcome is most directly enabled by ${t[0]}?`,t=>`A student confuses ${t[0]}. Which correction is accurate?`];
